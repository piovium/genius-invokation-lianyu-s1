services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres

  migrate:
    image: genius-invokation-server
    pull_policy: never
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
    depends_on:
      - db
    command: ["npx", "prisma", "migrate", "deploy"]
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
      args:
        DEFAULT_ASSETS_API_ENDPOINT: ${DEFAULT_ASSETS_API_ENDPOINT}

  server:
    image: genius-invokation-server
    pull_policy: never
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      REGISTRATION_CODE_SECRET: ${REGISTRATION_CODE_SECRET}
      BOT_SERVER_ORIGIN: ${BOT_SERVER_ORIGIN}
      BOT_SERVER_TOKEN: ${BOT_SERVER_TOKEN}
      BOT_GROUP_ID: ${BOT_GROUP_ID:-1016833703}
      ADMIN_QQS: ${ADMIN_QQS}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Piovium 恋雨杯}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      DEBUG_LOG_RECEIVE_URL: ${DEBUG_LOG_RECEIVE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
